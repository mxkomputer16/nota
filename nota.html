<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Nota Servis Online</title>
    <style>
        /* Pengaturan Ukuran Kertas A6 */
        @page {
            size: A6;
            margin: 5mm;
        }

        body { 
            font-family: 'Courier New', Courier, monospace; 
            width: 95mm; 
            margin: 0 auto; 
            color: #000; 
            background: #fff;
        }

        .box { 
            border: 1px solid #000; 
            padding: 15px; 
            min-height: 138mm; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header { 
            text-align: center; 
            border-bottom: 2px solid #000; 
            padding-bottom: 8px; 
            margin-bottom: 15px; 
        }
        .header h2 { margin: 0; font-size: 20px; text-transform: uppercase; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        td { padding: 6px 0; vertical-align: top; }
        .label { width: 30%; font-weight: bold; } /* Lebar label disesuaikan */
        
        .separator { border-top: 1px dashed #000; margin: 15px 0; }
        
        .footer { 
            text-align: center; 
            font-size: 12px; 
            margin-top: auto; 
            padding-top: 20px;
        }

        .btn-print { 
            display: block; 
            width: 100%; 
            max-width: 95mm;
            margin: 20px auto;
            padding: 12px; 
            background: #000; 
            color: #fff; 
            text-align: center; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 5px;
        }

        @media print { 
            .btn-print { display: none; } 
            body { width: 100%; margin: 0; } 
            .box { border: 1px solid #000; } 
        }
    </style>
</head>
<body>

<div class="box">
    <div class="header">
        <h2>WKWKWK LAND</h2>
        <small>Phone : 8888666600</small>
        <h2 style="margin-top: 10px;">NOTA SERVIS</h2>
        <small>Nomor: #<span id="val-id">-</span></small>
    </div>

    <table>
        <tr>
            <td class="label">Tgl Masuk</td>
            <td>: <span id="val-tgl">-</span></td>
        </tr>
        <tr>
            <td class="label">Pelanggan</td>
            <td>: <span id="val-nama">-</span></td>
        </tr>
        <tr>
            <td class="label">Telepon</td>
            <td>: <span id="val-telepon">-</span></td>
        </tr>
        <tr>
            <td class="label">Unit</td>
            <td>: <strong><span id="val-barang">-</span></strong></td>
        </tr>
    </table>

    <div class="separator"></div>

    <table>
        <tr>
            <td class="label">Kerusakan</td>
            <td>: <span id="val-kerusakan">-</span></td>
        </tr>
        <tr>
            <td class="label">Kelengkapan</td>
            <td>: <span id="val-kelengkapan">-</span></td>
        </tr>
    </table>

    <div class="separator"></div>
    <small>Note:</small>
    <div class="footer">
        <strong>Syarat & Ketentuan:</strong><br>
        Bawa nota ini saat pengambilan unit.<br>
        <br>
        Terima kasih atas kepercayaan Anda.<br>
        <small id="val-print-date"></small>
    </div>
</div>

<a href="javascript:window.print()" class="btn-print">CETAK NOTA (A6)</a>

<script>
    // Fungsi untuk mengambil parameter dari URL (Pengganti $_GET PHP)
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param) || '-';
    }

    // Mengisi data ke dalam HTML setelah halaman dimuat
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('val-id').innerText = getQueryParam('id');
        document.getElementById('val-tgl').innerText = getQueryParam('tgl_masuk');
        document.getElementById('val-nama').innerText = getQueryParam('nama');
        document.getElementById('val-telepon').innerText = getQueryParam('telepon');
        document.getElementById('val-barang').innerText = getQueryParam('barang');
        document.getElementById('val-kerusakan').innerText = getQueryParam('kerusakan');
        document.getElementById('val-kelengkapan').innerText = getQueryParam('kelengkapan');

        // Mengatur tanggal cetak otomatis
        const sekarang = new Date();
        const options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('val-print-date').innerText = "Dicetak pada: " + sekarang.toLocaleString('id-ID', options);
    });
</script>

</body>
</html>
